<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Movie Diary" />
  
  <!-- Android Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f1015" />
  
  <!-- Web App Manifest (Data URI for single-file deployment) -->
  <link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22Watchlist%20%26%20Diary%22%2C%22short_name%22%3A%22MovieDiary%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f1015%22%2C%22theme_color%22%3A%22%230f1015%22%7D" />

  <title>Watchlist & Diary</title>
  <style>
    :root {
      --bg: #0f1015;
      --card-bg: #181924;
      --card-border: #282a3c;
      --accent: #e50914;
      --accent-hover: #f40612;
      --gold: #f5c518;
      --text: #ffffff;
      --text-muted: #8b8ea0;
      --input-bg: #11121a;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    }

    header {
      background: rgba(15, 16, 21, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--card-border);
      padding: 16px 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .tabs {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: 0.15s;
    }

    .tab-btn.active {
      background: #252839;
      color: var(--text);
    }

    .counter-badge {
      background: rgba(255, 255, 255, 0.12);
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 12px;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .sort-select {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
      }
    }

    .movie-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #101118;
      position: relative;
      overflow: hidden;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
      padding: 12px;
      background: linear-gradient(180deg, #181924 0%, #101118 100%);
    }

    .card-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .icon-btn {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .icon-btn.delete-btn:hover {
      background: #e50914;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .movie-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .movie-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .rating-stars {
      color: var(--gold);
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
    }

    .genre-tag {
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      color: #c9ccd6;
    }

    .review-snippet {
      font-size: 0.75rem;
      color: #afb2c3;
      margin: 6px 0;
      font-style: italic;
      line-height: 1.3;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--accent);
    }

    .star-rating-select {
      display: flex;
      gap: 6px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #3b3d52;
    }

    .star-rating-select .star.active {
      color: var(--gold);
    }

    .hidden-file {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1><span>🎬</span> Movie Tracker</h1>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openModal()">+ Add</button>
        <button class="btn" onclick="exportData()">Export</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">Import</button>
        <input type="file" id="importFile" class="hidden-file" accept=".json" onchange="importData(event)" />
      </div>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" id="tabWatchlist" onclick="setTab('watchlist')">
        Want to Watch <span class="counter-badge" id="countWatchlist">0</span>
      </button>
      <button class="tab-btn" id="tabWatched" onclick="setTab('watched')">
        Watched Diary <span class="counter-badge" id="countWatched">0</span>
      </button>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search title, director, genre..." oninput="renderMovies()" />
      <select id="sortSelect" class="sort-select" onchange="renderMovies()">
        <option value="dateDesc">Recently Added</option>
        <option value="ratingDesc">Highest Rated</option>
        <option value="yearDesc">Release Year (Newest)</option>
        <option value="yearAsc">Release Year (Oldest)</option>
        <option value="titleAsc">Title (A-Z)</option>
      </select>
    </div>

    <div id="movieGrid" class="grid"></div>
    <div id="emptyState" class="empty-state" style="display: none;">
      <p>No movies found here yet.</p>
    </div>
  </div>

  <!-- Modal for Add / Edit -->
  <div id="movieModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle" style="font-size: 1.15rem;">Add Movie</h2>
        <button class="btn" onclick="closeModal()">✕</button>
      </div>
      <form id="movieForm" onsubmit="saveMovie(event)">
        <input type="hidden" id="movieId" />

        <div class="form-group">
          <label>List Status</label>
          <select id="movieStatus" class="form-select" onchange="toggleWatchedFields()">
            <option value="watchlist">Want to Watch</option>
            <option value="watched">Watched</option>
          </select>
        </div>

        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="movieTitle" class="form-input" required placeholder="e.g. Blade Runner 2049" />
        </div>

        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;">
            <label>Release Year</label>
            <input type="number" id="movieYear" class="form-input" placeholder="2017" />
          </div>
          <div class="form-group" style="flex: 1.5;">
            <label>Director</label>
            <input type="text" id="movieDirector" class="form-input" placeholder="Denis Villeneuve" />
          </div>
        </div>

        <div class="form-group">
          <label>Poster Image URL</label>
          <input type="url" id="moviePoster" class="form-input" placeholder="https://..." />
        </div>

        <div class="form-group">
          <label>Genres (comma-separated)</label>
          <input type="text" id="movieGenres" class="form-input" placeholder="Sci-Fi, Thriller, Neo-Noir" />
        </div>

        <div id="watchedFields" style="display: none;">
          <div class="form-group">
            <label>Your Rating</label>
            <div class="star-rating-select" id="starContainer">
              <span class="star" onclick="setRating(1)">★</span>
              <span class="star" onclick="setRating(2)">★</span>
              <span class="star" onclick="setRating(3)">★</span>
              <span class="star" onclick="setRating(4)">★</span>
              <span class="star" onclick="setRating(5)">★</span>
            </div>
            <input type="hidden" id="movieRating" value="0" />
          </div>

          <div class="form-group">
            <label>Date Watched</label>
            <input type="date" id="movieWatchDate" class="form-input" />
          </div>

          <div class="form-group">
            <label>Notes / Review</label>
            <textarea id="movieReview" class="form-textarea" rows="3" placeholder="Review or notes..."></textarea>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Movie</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Manual Backup Fallback Modal -->
  <div id="backupModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 style="font-size: 1.15rem;">Export Data</h2>
        <button class="btn" onclick="closeBackupModal()">✕</button>
      </div>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
        Tap Copy to copy your JSON library text directly to your clipboard.
      </p>
      <textarea id="backupTextarea" class="form-textarea" rows="8" readonly style="font-family: monospace; font-size: 0.75rem; margin-bottom: 16px;"></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn" onclick="closeBackupModal()">Close</button>
        <button class="btn btn-primary" onclick="copyBackupToClipboard()">Copy JSON</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'cine_diary_movies_v1';
    let movies = [];
    let currentTab = 'watchlist';

    function init() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          movies = JSON.parse(stored);
        } catch (e) {
          movies = [];
        }
      }
      renderMovies();
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
      renderMovies();
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('tabWatchlist').classList.toggle('active', tab === 'watchlist');
      document.getElementById('tabWatched').classList.toggle('active', tab === 'watched');
      renderMovies();
    }

    function toggleWatchedFields() {
      const status = document.getElementById('movieStatus').value;
      document.getElementById('watchedFields').style.display = status === 'watched' ? 'block' : 'none';
    }

    function setRating(val) {
      document.getElementById('movieRating').value = val;
      const stars = document.querySelectorAll('#starContainer .star');
      stars.forEach((star, idx) => {
        star.classList.toggle('active', idx < val);
      });
    }

    function openModal(editId = null) {
      const form = document.getElementById('movieForm');
      form.reset();
      setRating(0);

      if (editId) {
        const item = movies.find(m => m.id === editId);
        if (!item) return;
        document.getElementById('modalTitle').textContent = 'Edit Movie';
        document.getElementById('movieId').value = item.id;
        document.getElementById('movieStatus').value = item.status;
        document.getElementById('movieTitle').value = item.title;
        document.getElementById('movieYear').value = item.year || '';
        document.getElementById('movieDirector').value = item.director || '';
        document.getElementById('moviePoster').value = item.poster || '';
        document.getElementById('movieGenres').value = (item.genres || []).join(', ');
        document.getElementById('movieRating').value = item.rating || 0;
        document.getElementById('movieWatchDate').value = item.watchDate || '';
        document.getElementById('movieReview').value = item.review || '';
        setRating(item.rating || 0);
      } else {
        document.getElementById('modalTitle').textContent = 'Add Movie';
        document.getElementById('movieId').value = '';
        document.getElementById('movieStatus').value = currentTab;
        document.getElementById('movieWatchDate').value = new Date().toISOString().split('T')[0];
      }

      toggleWatchedFields();
      document.getElementById('movieModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('movieModal').classList.remove('active');
    }

    function saveMovie(e) {
      e.preventDefault();
      const id = document.getElementById('movieId').value;
      const title = document.getElementById('movieTitle').value.trim();
      const status = document.getElementById('movieStatus').value;
      const year = document.getElementById('movieYear').value ? parseInt(document.getElementById('movieYear').value) : null;
      const director = document.getElementById('movieDirector').value.trim();
      const poster = document.getElementById('moviePoster').value.trim();
      const genres = document.getElementById('movieGenres').value
        .split(',')
        .map(g => g.trim())
        .filter(g => g.length > 0);
      const rating = parseInt(document.getElementById('movieRating').value) || 0;
      const watchDate = document.getElementById('movieWatchDate').value;
      const review = document.getElementById('movieReview').value.trim();

      if (id) {
        const index = movies.findIndex(m => m.id === id);
        if (index !== -1) {
          movies[index] = {
            ...movies[index],
            title,
            status,
            year,
            director,
            poster,
            genres,
            rating: status === 'watched' ? rating : 0,
            watchDate: status === 'watched' ? watchDate : null,
            review: status === 'watched' ? review : '',
            updatedAt: Date.now()
          };
        }
      } else {
        const newMovie = {
          id: 'mov_' + Date.now() + Math.random().toString(36).substring(2, 6),
          title,
          status,
          year,
          director,
          poster,
          genres,
          rating: status === 'watched' ? rating : 0,
          watchDate: status === 'watched' ? watchDate : null,
          review: status === 'watched' ? review : '',
          createdAt: Date.now()
        };
        movies.unshift(newMovie);
      }

      saveToStorage();
      closeModal();
    }

    function deleteMovie(id, e) {
      if (e) e.stopPropagation();
      const movie = movies.find(m => m.id === id);
      if (!movie) return;
      if (confirm(`Delete "${movie.title}"?`)) {
        movies = movies.filter(m => m.id !== id);
        saveToStorage();
      }
    }

    function renderMovies() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;

      const watchlistCount = movies.filter(m => m.status === 'watchlist').length;
      const watchedCount = movies.filter(m => m.status === 'watched').length;
      document.getElementById('countWatchlist').textContent = watchlistCount;
      document.getElementById('countWatched').textContent = watchedCount;

      let filtered = movies.filter(m => m.status === currentTab);

      if (search) {
        filtered = filtered.filter(m => 
          m.title.toLowerCase().includes(search) ||
          (m.director && m.director.toLowerCase().includes(search)) ||
          (m.genres && m.genres.some(g => g.toLowerCase().includes(search)))
        );
      }

      filtered.sort((a, b) => {
        if (sort === 'ratingDesc') return (b.rating || 0) - (a.rating || 0);
        if (sort === 'yearDesc') return (b.year || 0) - (a.year || 0);
        if (sort === 'yearAsc') return (a.year || 9999) - (b.year || 9999);
        if (sort === 'titleAsc') return a.title.localeCompare(b.title);
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      const grid = document.getElementById('movieGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';

        let starsHtml = '';
        if (m.status === 'watched' && m.rating > 0) {
          starsHtml = `<div class="rating-stars">${'★'.repeat(m.rating)}${'☆'.repeat(5 - m.rating)}</div>`;
        }

        let tagsHtml = '';
        if (m.genres && m.genres.length > 0) {
          tagsHtml = `<div class="tags-container">${m.genres.map(g => `<span class="genre-tag">${escapeHtml(g)}</span>`).join('')}</div>`;
        }

        const posterContent = m.poster 
          ? `<img src="${escapeHtml(m.poster)}" class="poster-img" alt="${escapeHtml(m.title)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" /><div class="poster-placeholder" style="display:none;">🎬<br>${escapeHtml(m.title)}</div>`
          : `<div class="poster-placeholder">🎬<br><strong>${escapeHtml(m.title)}</strong></div>`;

        card.innerHTML = `
          <div class="poster-box">
            ${posterContent}
            <div class="card-actions">
              <button class="icon-btn" title="Edit" onclick="openModal('${m.id}')">✏️</button>
              <button class="icon-btn delete-btn" title="Delete" onclick="deleteMovie('${m.id}', event)">🗑️</button>
            </div>
          </div>
          <div class="card-body">
            <div class="movie-title">${escapeHtml(m.title)}</div>
            <div class="movie-meta">
              ${m.year ? `${m.year}` : ''}${m.year && m.director ? ' • ' : ''}${m.director ? escapeHtml(m.director) : ''}
            </div>
            ${starsHtml}
            ${m.review ? `<div class="review-snippet">"${escapeHtml(m.review)}"</div>` : ''}
            ${tagsHtml}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function exportData() {
      const jsonString = JSON.stringify(movies, null, 2);
      const filename = `movies_backup_${new Date().toISOString().split('T')[0]}.json`;

      // 1. Check for native Share API support (iOS standalone + Android Chrome)
      if (navigator.share) {
        try {
          const file = new File([jsonString], filename, { type: 'application/json' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'Movie Tracker Backup',
              text: 'Movie Watchlist & Diary JSON Backup'
            });
            return;
          }
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // 2. Direct Anchor download (standard Android Chrome & desktop browsers)
      try {
        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 200);
        return;
      } catch (err) {
        console.warn('Anchor download failed:', err);
      }

      // 3. Universal Copy Fallback
      showBackupModal(jsonString);
    }

    function showBackupModal(text) {
      document.getElementById('backupTextarea').value = text;
      document.getElementById('backupModal').classList.add('active');
    }

    function closeBackupModal() {
      document.getElementById('backupModal').classList.remove('active');
    }

    function copyBackupToClipboard() {
      const textarea = document.getElementById('backupTextarea');
      textarea.select();
      textarea.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(textarea.value).then(() => {
        alert('Copied JSON data to clipboard!');
        closeBackupModal();
      }).catch(() => {
        alert('Failed to copy. Please manually select and copy the text.');
      });
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            movies = imported;
            saveToStorage();
            alert('Successfully imported movie library!');
          } else {
            alert('Invalid JSON file format.');
          }
        } catch (err) {
          alert('Error parsing JSON file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
